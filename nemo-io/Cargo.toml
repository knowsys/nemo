[package]
name = "nemo-io"
description = "Format and network adapters for the Nemo rule engine: import and export of tabular and RDF data"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true

[features]
# Remote resources: the blocking client that performs http(s) requests,
# with retries.
http = ["dep:reqwest"]
# The Arrow interchange mapping (record batches from value rows).
arrow = ["dep:arrow"]
# Parquet import and export, through Arrow.
parquet = ["arrow", "dep:parquet"]

[dependencies]
csv = "1.4"
flate2 = "1.1"
oxrdf = "0.3"
oxrdfio = "0.2"
# The JSON reader's own tree is built through serde's data model.
serde = "1"
serde_json = "1.0"
nemo-physical = { path = "../nemo-physical" }
# Developer logging: the facade only.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# The blocking client is the synchronous adapter over the async edge —
# no runtime of our own; rustls keeps the build self-contained.
reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "blocking",
    "rustls-tls",
    "gzip",
] }
# SPARQL endpoint imports: query validation and request building, which
# need no network stack, since sending the requests is `http`'s.
spargebra = "0.4"
arrow = { version = "56", optional = true, default-features = false }
parquet = { version = "56", optional = true, default-features = false, features = [
    "arrow",
    "snap",
    "flate2",
    "flate2-rust_backened",
    "zstd",
] }

[lints]
workspace = true

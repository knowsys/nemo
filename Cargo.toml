# Workspace of the Nemo rule engine.
[workspace]
resolver = "3"
members = [
    "nemo-physical",
    "nemo-io",
    "nemo",
    "nemo-cli",
    "nemo-language-server",
    "nemo-python",
    "nemo-wasm",
    # Development tasks, run as `cargo xtask`.
    "xtask",
]
# Everything but the language server, whose binary an editor launches (with one
# binary among the defaults, a bare `cargo run` is `nmo`), and the bindings,
# which need their host toolchains (a Python for the extension module, the
# wasm32 target). All of them build and test under `--workspace`, except
# nemo-wasm, which builds only for wasm32 targets.
default-members = ["nemo-physical", "nemo-io", "nemo", "nemo-cli"]

[workspace.package]
description = "Nemo, a datalog-based rule engine for fast and scalable analytic data processing in memory"
version = "0.11.0-dev"
authors = [
"Alex Ivliev <alex.ivliev@tu-dresden.de>",
"Aidan Bailey <dev@aidanbailey.me>",
"Jakob Steinberg <jakob_maximilian.steinberg@mailbox.tu-dresden.de>",
"Lukas Gerlach <lukas.gerlach@tu-dresden.de>",
"Larry González <larry.gonzalez@tu-dresden.de>",
"Markus Krötzsch <markus.kroetzsch@tu-dresden.de>",
"Matthias Meissner <matthias.meissner2@mailbox.tu-dresden.de>",
"Maximilian Marx <maximilian.marx@tu-dresden.de>",
"Simon Meusel <simon.meusel@mailbox.tu-dresden.de>",
"Stefan Ellmauthaler <stefan.ellmauthaler@tu-dresden.de>",
]
edition = "2024"
homepage = "https://github.com/knowsys/nemo"
license = "APACHE-2.0 OR MIT"
readme = "README.md"
repository = "https://github.com/knowsys/nemo"

[workspace.lints.rust]
missing_docs = "warn"
# An item marked `pub` that the crate never exports reads as API it is not.
unreachable_pub = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
debug = true

#debug profile without debug assertions
[profile.debug-noassert]
inherits = "dev"
debug-assertions = false

#profile with minimal executable size
[profile.release-minimal]
inherits = "release"
panic = "abort"
debug = false
strip = true

[profile.bench]
inherits = "release-minimal"

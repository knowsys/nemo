[package]
name = "nemo-language-server"
description = "The Nemo language server: diagnostics, symbols, and navigation for Nemo programs"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "nemo-language-server"
path = "src/main.rs"
required-features = ["stdio"]

[features]
default = ["stdio"]
# The native server: speaks the protocol over standard input and
# output on a tokio runtime.
stdio = [
    "tower-lsp-server/runtime-tokio",
    "tokio/rt-multi-thread",
    "tokio/io-std",
    "tokio/macros",
]
# The embeddable service without a runtime — what a browser drives
# through its own message loop. Exclusive with `stdio`: the protocol
# crate's two runtimes cannot coexist in one build.
wasm = ["tower-lsp-server/runtime-agnostic"]

[dependencies]
# `sparql` is validation only (no network stack): the editor's check
# diagnoses a broken query the way a run would.
nemo = { path = "../nemo", features = ["sparql"] }
nemo-physical = { path = "../nemo-physical" }

tower-lsp-server = { version = "0.23", default-features = false }
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true

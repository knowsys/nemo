[package]
name = "nemo-physical"
description = "The database layer of the Nemo rule engine"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true

[dependencies]
bumpalo = { version = "3", features = ["collections"] }
fancy-regex = "0.14"
hashbrown = "0.17"
md-5 = "0.10"
num-bigint = "0.4"
num-integer = "0.1"
oxsdatatypes = "0.2"
rand = "0.8"
rayon-core = "1.12"
sha1 = "0.10"
sha2 = "0.10"
tracing = { version = "0.1", default-features = false, features = ["std"] }
unicode-segmentation = "1"
web-time = "1"

[lints]
workspace = true

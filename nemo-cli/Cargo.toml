[package]
name = "nemo-cli"
description = "The command line interface of the Nemo rule engine"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true

[[bin]]
name = "nmo"
path = "src/main.rs"

[dependencies]
# The command line ships the full IO surface: remote resources, SPARQL
# endpoints, and Parquet.
nemo = { path = "../nemo", features = ["http", "sparql", "parquet", "subscriber"] }
nemo-io = { path = "../nemo-io" }
nemo-physical = { path = "../nemo-physical" }

clap = { version = "4.5", features = ["derive"] }
# `--trace-tree` and `--trace-node` read the protocol's serde types, and
# `--trace-output` writes the inference list as JSON.
serde = "1"
serde_json = "1"
# The global subscriber: `-v`/`--log`/`NMO_LOG` to stderr, the telemetry
# stream into the recorder, and `--events` as JSON lines.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "env-filter",
    "fmt",
    "json",
    "registry",
    "std",
] }

[lints]
workspace = true

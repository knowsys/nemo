[package]
name = "nemo-wasm"
description = "WebAssembly bindings for the Nemo rule engine"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# SPARQL imports load and reason in the browser too, fetched through the
# global `fetch`.
nemo = { path = "../nemo", features = ["sparql"] }
# Exact: the nix flake post-processes the module with the wasm-bindgen-cli
# of the same version, which nixpkgs must provide.
wasm-bindgen = "=0.2.126"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
# Protocol queries cross through their JSON form.
serde_json = "1"
js-sys = "0.3"
console_error_panic_hook = "0.1"
# The async methods and the language server await JavaScript promises.
futures = { version = "0.3", default-features = false, features = ["std"] }
wasm-bindgen-futures = "0.4"
# oxrdf (via nemo-io) uses randomness, which on wasm needs the JS
# entropy source.
getrandom = { version = "0.2", features = ["js"] }

# The language server runs inside the browser too; it is a wasm-only
# dependency because the protocol crate's browser runtime and the native
# server's tokio runtime cannot share one build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
nemo-language-server = { path = "../nemo-language-server", default-features = false, features = ["wasm"] }
tower-service = "0.3"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lints]
workspace = true

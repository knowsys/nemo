<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nemo run report</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2430; --muted: #67707e;
    --line: #e3e6ea; --accent: #2563eb; --accent-soft: #2563eb22;
    --good: #16a34a; --warn: #d97706; --bad: #dc2626;
    --p1: #2563eb; --p2: #7c3aed; --p3: #db2777; --p4: #ea580c;
    --p5: #ca8a04; --p6: #16a34a; --p7: #0d9488; --p8: #64748b; --p9: #94a3b8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --panel: #1a2029; --ink: #e5e9ef; --muted: #8b95a3;
      --line: #2a3341; --accent: #60a5fa; --accent-soft: #60a5fa2a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 system-ui, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1080px; margin: 0 auto; padding: 24px 20px 48px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  header h1 { font-size: 20px; margin: 0; font-weight: 650; }
  header .brand { color: var(--muted); font-weight: 650; }
  .badge {
    font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent);
  }
  .badge.finished { background: #16a34a22; color: var(--good); }
  .badge.cancelled { background: #d9770622; color: var(--warn); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .tile .value { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tile .label { color: var(--muted); font-size: 12px; }
  section { margin-top: 22px; }
  section h2 { font-size: 14px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 8px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 760px) { .charts { grid-template-columns: 1fr; } }
  svg text { fill: var(--muted); font-size: 10px; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 5px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-size: 12px; font-weight: 600; }
  th:first-child, td:first-child { text-align: left; }
  td.rule { font-family: ui-monospace, Consolas, monospace; font-size: 12px; max-width: 480px; overflow: hidden; text-overflow: ellipsis; }
  tr:last-child td { border-bottom: none; }
  .bar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
  .bar div { min-width: 1px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
  .legend .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; }
  .empty { color: var(--muted); font-style: italic; }
  ul.plain { margin: 0; padding-left: 18px; }
  .warnline { color: var(--warn); }
  table.diff { table-layout: fixed; }
  table.diff td { text-align: left; white-space: pre-wrap; word-break: break-word; vertical-align: top;
    font-family: ui-monospace, Consolas, monospace; font-size: 12px; width: 50%; padding: 1px 10px; border-bottom: none; }
  table.diff td.old { border-right: 1px solid var(--line); }
  table.diff tr.add td.new { background: #16a34a1f; }
  table.diff tr.del td.old { background: #dc26261f; }
  table.diff tr.gap td { color: var(--muted); }
  .stage-name { font-family: ui-monospace, Consolas, monospace; text-transform: none; letter-spacing: 0; }
  footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main id="page"><p class="empty">Waiting for the first data…</p></main>
<script>
"use strict";
const LIVE = __LIVE__;
const DOCUMENT = __DOCUMENT__;

const PHASE_COLORS = ["--p1","--p2","--p3","--p4","--p5","--p6","--p7","--p8","--p9"];

function fmtNs(ns) {
  if (ns == null) return "–";
  const ms = ns / 1e6;
  if (ms < 1) return ms.toFixed(2) + " ms";
  if (ms < 1000) return ms < 10 ? ms.toFixed(1) + " ms" : Math.round(ms) + " ms";
  const s = ms / 1000;
  if (s < 60) return (s < 10 ? s.toFixed(2) : s.toFixed(1)) + " s";
  return Math.floor(s / 60) + " min " + Math.round(s % 60) + " s";
}
function fmtCount(n) {
  if (n == null) return "–";
  return n.toLocaleString("en-US");
}
function fmtBytes(bytes) {
  if (bytes == null) return "–";
  const mb = bytes / (1024 * 1024);
  if (mb < 1) return (bytes / 1024).toFixed(1) + " KB";
  if (mb < 1024) return (mb < 10 ? mb.toFixed(2) : mb.toFixed(1)) + " MB";
  return (mb / 1024).toFixed(2) + " GB";
}
function esc(text) {
  return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

// A filled line chart over [x, y] points, as responsive inline SVG.
function chart(points, formatY) {
  if (!points || points.length === 0) return '<p class="empty">nothing yet</p>';
  const W = 460, H = 150, L = 6, R = 6, T = 8, B = 18;
  const xs = points.map(p => p[0]), ys = points.map(p => p[1]);
  const x0 = 0, x1 = Math.max(...xs, 1);
  const y0 = 0, y1 = Math.max(...ys, 1);
  const px = x => L + (x - x0) / (x1 - x0 || 1) * (W - L - R);
  const py = y => H - B - (y - y0) / (y1 - y0 || 1) * (H - T - B);
  let path = "M" + px(xs[0]).toFixed(1) + " " + py(ys[0]).toFixed(1);
  for (let i = 1; i < points.length; i++) {
    path += " L" + px(xs[i]).toFixed(1) + " " + py(ys[i]).toFixed(1);
  }
  const area = path + " L" + px(xs[xs.length - 1]).toFixed(1) + " " + (H - B) +
    " L" + px(xs[0]).toFixed(1) + " " + (H - B) + " Z";
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto">' +
    '<path d="' + area + '" fill="var(--accent-soft)"/>' +
    '<path d="' + path + '" fill="none" stroke="var(--accent)" stroke-width="1.6"/>' +
    '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R) + '" y2="' + (H - B) + '" stroke="var(--line)"/>' +
    '<text x="' + L + '" y="' + (H - 5) + '">0</text>' +
    '<text x="' + (W - R) + '" y="' + (H - 5) + '" text-anchor="end">' + esc(fmtNs(x1)) + '</text>' +
    '<text x="' + (W - R) + '" y="' + (T + 4) + '" text-anchor="end">' + esc(formatY(y1)) + '</text>' +
    '</svg>';
}

function tiles(doc) {
  const run = doc.run, t = doc.telemetry;
  const items = [
    ["derived facts", fmtCount(run ? run.derived : t && t.derived)],
    ["rule applications", run ? fmtCount(run.applications)
      : t ? fmtCount(t.rules.reduce((sum, rule) => sum + rule.applications, 0)) : "–"],
    [run ? "total wall time" : "elapsed", fmtNs(run ? run.stages.total : t && t.duration)],
    ["table memory", fmtBytes(run ? run.memory : t && t.memory)],
    ["stored rows", fmtCount(run
      ? run.predicates.reduce((sum, p) => sum + p.rows, 0)
      : t && t.total)],
  ];
  return '<div class="tiles">' + items.map(([label, value]) =>
    '<div class="tile"><div class="value">' + value + '</div><div class="label">' +
    esc(label) + '</div></div>').join("") + '</div>';
}

function curves(t) {
  if (!t) return "";
  let derived = 0;
  const growth = t.timeline.map(([at, rows]) => [at, derived += rows]);
  const memory = t.iterations.map(s => [s[0], s[4]]);
  return '<section><h2>Progress</h2><div class="charts">' +
    '<div class="panel"><h2>derived facts over time</h2>' + chart(growth, fmtCount) + '</div>' +
    '<div class="panel"><h2>memory over time</h2>' + chart(memory, fmtBytes) + '</div>' +
    '</div></section>';
}

// The phases plan execution names, disjoint; `setup` is measured within
// `join` and `total` spans them all, so neither is a slice of its own.
const PHASES_NAMED = ["order", "join", "merge", "build", "encode"];

function phases(doc) {
  const source = doc.run ? doc.run.phases : doc.telemetry && doc.telemetry.phases;
  if (!source) return "";
  const entries = Object.entries(source).filter(([name]) => name !== "total" && name !== "setup");
  if ("total" in source) {
    // What plan execution spent outside the named phases (block lookup,
    // combination enumeration, projections, result assembly).
    // The run facts already carry it as `glue`.
    const named = PHASES_NAMED.reduce((sum, name) => sum + (source[name] || 0), 0);
    entries.push(["glue", Math.max(0, source.total - named)]);
  }
  const total = entries.reduce((sum, [, ns]) => sum + ns, 0);
  if (total === 0) return "";
  const detail = name =>
    name === "join" && source.setup ? " (of which setup " + fmtNs(source.setup) + ")" : "";
  const bar = entries.map(([name, ns], index) =>
    '<div style="width:' + (100 * ns / total).toFixed(2) + '%;background:var(' +
    PHASE_COLORS[index % PHASE_COLORS.length] + ')" title="' +
    esc(name + ': ' + fmtNs(ns) + detail(name)) + '"></div>'
  ).join("");
  const legend = entries.map(([name, ns], index) =>
    '<span><span class="swatch" style="background:var(' + PHASE_COLORS[index % PHASE_COLORS.length] +
    ')"></span>' + esc(name + ' · ' + fmtNs(ns) + detail(name)) + '</span>').join("");
  return '<section><h2>Where the time went</h2><div class="panel">' +
    '<div class="bar">' + bar + '</div><div class="legend">' + legend + '</div></div></section>';
}

function rules(t) {
  if (!t || t.rules.length === 0) return "";
  const rows = t.rules
    .map((rule, index) => ({ ...rule, index }))
    .filter(rule => rule.applications > 0)
    .sort((a, b) => b.duration - a.duration);
  if (rows.length === 0) return "";
  const body = rows.map(rule =>
    '<tr><td class="rule" title="' + esc(rule.text) + '">' + esc(rule.text || "rule " + rule.index) +
    '</td><td>' + fmtCount(rule.applications) + '</td><td>' + esc(fmtNs(rule.duration)) +
    '</td><td>' + fmtCount(rule.derived) + '</td><td' + (rule.dropped ? ' class="warnline"' : '') +
    '>' + fmtCount(rule.dropped) + '</td></tr>').join("");
  return '<section><h2>Rules by time</h2><div class="panel scroll"><table>' +
    '<thead><tr><th>rule</th><th>applications</th><th>time</th><th>derived</th><th>dropped</th></tr></thead>' +
    '<tbody>' + body + '</tbody></table></div></section>';
}

function predicates(run) {
  if (!run || run.predicates.length === 0) return "";
  const body = run.predicates.map(p =>
    '<tr><td class="rule">' + esc(p.name) + '</td><td>' + p.columns +
    '</td><td>' + fmtCount(p.rows) + '</td></tr>').join("");
  return '<section><h2>Predicates</h2><div class="panel scroll"><table>' +
    '<thead><tr><th>predicate</th><th>columns</th><th>rows</th></tr></thead><tbody>' + body +
    '</tbody></table></div></section>';
}

function extras(doc) {
  const t = doc.telemetry;
  const parts = [];
  if (t && t.imports.length > 0) {
    parts.push('<div class="panel"><h2>imports</h2><ul class="plain">' +
      t.imports.map(i => '<li><span class="rule">' + esc(i.resource) + '</span> — ' +
        fmtCount(i.rows) + ' rows</li>').join("") + '</ul></div>');
  }
  if (doc.run && doc.run.errors.length > 0) {
    parts.push('<div class="panel"><h2>dropped derivations</h2><ul class="plain">' +
      doc.run.errors.map(e => '<li class="warnline">' + fmtCount(e.count) + ' × ' +
        esc(e.kind) + '</li>').join("") + '</ul></div>');
  }
  if (parts.length === 0) return "";
  return '<section><div class="charts">' + parts.join("") + '</div></section>';
}

// The edit distance past which two texts are shown unaligned: an
// alignment of that many changes reads no better, and the search for
// it costs the texts' lengths per unit of distance.
const EDIT_BUDGET = 1000;

// The rows of a line diff: [left, right, kind] with kind one of "same",
// "add", "del". The lines the texts share at either end match outright;
// what lies between is aligned along a shortest edit script. A stage
// rewrites a few lines of a program that may run to tens of thousands,
// so the cost must follow the changes, not the program.
function diffLines(a, b) {
  const n = a.length, m = b.length;
  let head = 0;
  while (head < n && head < m && a[head] === b[head]) head++;
  let tail = 0;
  while (tail < n - head && tail < m - head && a[n - 1 - tail] === b[m - 1 - tail]) tail++;
  const rows = [];
  for (let i = 0; i < head; i++) rows.push([a[i], b[i], "same"]);
  align(a.slice(head, n - tail), b.slice(head, m - tail), rows);
  for (let i = 0; i < tail; i++) rows.push([a[n - tail + i], b[m - tail + i], "same"]);
  return rows;
}

// Appends the rows aligning two runs of lines: along their shortest
// edit script where one within the budget exists, else the one run as
// removed and the other as added.
function align(a, b, rows) {
  const moves = a.length > 0 && b.length > 0 ? shortestEdit(a, b) : null;
  if (!moves) {
    for (const line of a) rows.push([line, "", "del"]);
    for (const line of b) rows.push(["", line, "add"]);
    return;
  }
  let i = 0, j = 0;
  for (const move of moves) {
    if (move === "same") { rows.push([a[i], b[j], "same"]); i++; j++; }
    else if (move === "del") rows.push([a[i++], "", "del"]);
    else rows.push(["", b[j++], "add"]);
  }
}

// Myers' search for a shortest edit script: round d finds, for every
// diagonal k = x − y, the furthest point reachable with d edits, so a
// few changed lines cost a few rounds over the texts and the rounds
// kept for the walk back take memory in the order of the distance
// squared, never of the texts' product. The moves in order, or null
// when no script within the budget exists.
function shortestEdit(a, b) {
  const n = a.length, m = b.length;
  const max = Math.min(n + m, EDIT_BUDGET);
  const at = k => k + max + 1;
  const v = new Int32Array(2 * max + 3);
  const rounds = [];
  for (let d = 0; d <= max; d++) {
    rounds.push(v.slice(at(-d - 1), at(d + 1) + 1));
    for (let k = -d; k <= d; k += 2) {
      let x = k === -d || (k !== d && v[at(k - 1)] < v[at(k + 1)]) ? v[at(k + 1)] : v[at(k - 1)] + 1;
      let y = x - k;
      while (x < n && y < m && a[x] === b[y]) { x++; y++; }
      v[at(k)] = x;
      if (x >= n && y >= m) return walkBack(rounds, n, m);
    }
  }
  return null;
}

// Walks the rounds of the search back from the end of both texts to
// the start, reading off the moves of the script it found.
function walkBack(rounds, n, m) {
  const moves = [];
  let x = n, y = m;
  for (let d = rounds.length - 1; d >= 0; d--) {
    const v = rounds[d], at = k => k + d + 1;
    const k = x - y;
    const previous = k === -d || (k !== d && v[at(k - 1)] < v[at(k + 1)]) ? k + 1 : k - 1;
    const px = v[at(previous)], py = px - previous;
    while (x > px && y > py) { moves.push("same"); x--; y--; }
    if (d > 0) moves.push(x === px ? "add" : "del");
    x = px; y = py;
  }
  return moves.reverse();
}

// The program after every stage that rewrote it, each beside the
// program it rewrote: what the engine ran, and how it got there.
function rewrites(run) {
  if (!run || !run.programs || run.programs.length < 2) return "";
  const lines = text => text.replace(/\n$/, "").split("\n");
  const sections = [];
  for (let k = 1; k < run.programs.length; k++) {
    const before = run.programs[k - 1], after = run.programs[k];
    const rows = diffLines(lines(before.text), lines(after.text));
    const body = rows.map(([left, right, kind]) =>
      '<tr class="' + kind + '"><td class="old">' + esc(left) + '</td><td class="new">' + esc(right) + '</td></tr>'
    ).join("");
    sections.push('<section><h2>Program after the <span class="stage-name">' + esc(after.stage) +
      '</span> stage</h2><div class="panel scroll"><table class="diff"><thead><tr>' +
      '<th>after ' + esc(before.stage) + '</th><th>after ' + esc(after.stage) + '</th></tr></thead>' +
      '<tbody>' + body + '</tbody></table></div></section>');
  }
  return sections.join("");
}

function stages(run) {
  if (!run) return "";
  const body = Object.entries(run.stages).map(([name, ns]) =>
    '<tr><td>' + esc(name) + '</td><td>' + esc(fmtNs(ns)) + '</td></tr>').join("");
  return '<section><h2>Stages</h2><div class="panel scroll"><table><tbody>' +
    body + '</tbody></table></div></section>';
}

function render(doc) {
  if (!doc) return;
  const t = doc.telemetry;
  const status = !t ? "finished" : t.finished ? (t.fixpoint ? "finished" : "cancelled") : "running";
  document.getElementById("page").innerHTML =
    '<header><h1><span class="brand">Nemo</span> ' + esc(doc.title || "run") + '</h1>' +
    '<span class="badge ' + status + '">' + status + '</span></header>' +
    tiles(doc) + curves(t) + phases(doc) + rules(t) + rewrites(doc.run) + predicates(doc.run) +
    extras(doc) + stages(doc.run) +
    '<footer>Generated by the Nemo rule engine' + (LIVE ? " · live" : "") + '.</footer>';
}

render(DOCUMENT);
if (LIVE) {
  const source = new EventSource("/events");
  source.onmessage = event => render(JSON.parse(event.data));
}
</script>
</body>
</html>

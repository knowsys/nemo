[package]
name = "nemo"
description = "The logical layer of the Nemo rule engine: language, rule model, planning, and execution"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true

[features]
# The HTTP client, every engine's default client: sends the requests of
# remote data (http/https resources), with retries.
http = ["nemo-io/http"]
# SPARQL endpoint imports: validation and requests. The engine's client
# sends the requests, or `resume` takes the responses to them.
sparql = ["nemo-io/sparql"]
# Parquet import and export.
parquet = ["nemo-io/parquet"]

[dependencies]
nemo-physical = { path = "../nemo-physical" }
nemo-io = { path = "../nemo-io" }
# The default diagnostic renderer (`render`) quotes snippets through it.
ariadne = "0.6"
# The tracing protocol DTOs are serde-first: one derived dialect, shared
# verbatim by every surface.
serde = { version = "1", features = ["derive"] }
# The telemetry documents are written as JSON.
serde_json = "1"
# Developer logging and the telemetry stream: the facade only.
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
# The testcase corpus registers one test per program.
libtest-mimic = "0.8"
# An in-memory SPARQL endpoint, which the differential tests of the rewrite stage query:
# the data (oxrdf, oxttl), the evaluator, and its TSV results.
oxrdf = "0.3"
oxttl = "0.2"
spareval = "0.2"
sparesults = "0.3"
[[test]]
name = "testcases"
harness = false

[lints]
workspace = true

[package]
name = "nemo"
description = "The logical layer of the Nemo rule engine: language, rule model, planning, and execution"
version.workspace = true
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true

[features]
# The driver: performs the HTTP requests of suspended engine methods
# (remote http/https resources), with retries.
http = ["nemo-io/http"]
# SPARQL endpoint imports: validation and requests. The `http` driver
# performs the requests, or the responses are passed in through `respond`.
sparql = ["nemo-io/sparql"]
# Parquet import and export.
parquet = ["nemo-io/parquet"]
# The `tracing` subscriber side: a layer feeding an event sink from the
# telemetry stream. The command line, which owns the global subscriber,
# enables it. The bindings install a sink on the engine directly.
subscriber = ["dep:tracing-subscriber"]

[dependencies]
nemo-physical = { path = "../nemo-physical" }
nemo-io = { path = "../nemo-io" }
# The default diagnostic renderer (`render`) quotes snippets through it.
ariadne = "0.6"
# The tracing protocol DTOs are serde-first: one derived dialect, shared
# verbatim by every surface.
serde = { version = "1", features = ["derive"] }
# The telemetry documents are written as JSON.
serde_json = "1"
# Developer logging and the telemetry stream's wire: the facade always,
# the subscriber side behind `subscriber`.
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", optional = true, default-features = false, features = [
    "registry",
    "std",
] }

[dev-dependencies]
# The testcase corpus registers one test per program.
libtest-mimic = "0.8"
[[test]]
name = "testcases"
harness = false

[lints]
workspace = true
